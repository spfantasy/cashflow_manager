name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 运行 pytest
        run: python -m pytest -v

  build-windows:
    name: 打包 Windows exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: PyInstaller 打包
        run: pyinstaller --noconfirm --clean cashflow_manager.spec

      - name: 冒烟测试（--init-db）
        env:
          PYTHONIOENCODING: utf-8
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          & .\dist\CashflowManager.exe --init-db
          $code = $LASTEXITCODE
          Write-Host "exit code = $code"
          if ($code -ne 0) { throw "CashflowManager.exe --init-db 退出码 $code" }

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CashflowManager-windows
          path: dist/CashflowManager.exe
          if-no-files-found: error
